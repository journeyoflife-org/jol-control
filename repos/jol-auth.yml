# Allow-list definition for jol-auth
# Managed by jol-control — DO NOT edit outside this repo.
# Compliance: SOC2 / GDPR / ISO 27001

name: jol-auth
description: "Authentication and identity management \u2014 OAuth 2.0 / OpenID Connect, multi-tenant RBAC, short-lived credentials,\
  \ and session management across 400,000 institutions in 27 EU countries."
visibility: public
tier: platform
language: Python
topics:
- auth
- oauth2
- oidc
- rbac
- identity
settings:
  has_issues: true
  has_wiki: false
  has_projects: false
  delete_branch_on_merge: true
  allow_merge_commit: false
  allow_squash_merge: true
  allow_rebase_merge: true
  vulnerability_alerts: true
  archived: false
  is_template: false
  auto_init: false
branch_protection:
  main:
    required_status_checks:
      strict: true
      contexts:
      - ci / test
      - codeql-analysis
      - dependency-review
    required_pull_request_reviews:
      required_approving_review_count: 1
      dismiss_stale_reviews: true
      require_code_owner_reviews: false
      require_last_push_approval: true
    enforce_admins: true
    restrict_pushes: true
    require_signed_commits: true
    require_linear_history: true
    block_force_pushes: true
    block_deletions: true
teams:
  platform-admins: push
  developers: push
  auditors: pull
compliance:
  frameworks:
  - soc2
  - gdpr
  - iso27001
  data_classification: internal
  required_gates:
    dependency_scan: true
    secret_scan: true
    license_check: true
    code_quality: true
    security_review: true
