# Allow-list definition for jol-control
# Managed by jol-control — DO NOT edit outside this repo.
# Compliance: SOC2 / GDPR / ISO 27001

name: jol-control
description: "Central governance control plane \u2014 Terraform IaC, policy baselines, compliance gates, and audit checklists\
  \ for all journeyoflife-org repositories."
visibility: public
tier: governance
language: YAML
topics:
- governance
- iac
- terraform
- compliance
- soc2
- gdpr
- iso27001
settings:
  has_issues: true
  has_wiki: false
  has_projects: false
  delete_branch_on_merge: true
  allow_merge_commit: false
  allow_squash_merge: true
  allow_rebase_merge: true
  vulnerability_alerts: true
  archived: false
  is_template: false
  auto_init: false
branch_protection:
  main:
    required_status_checks:
      strict: true
      # A required context must match the check-run name GitHub actually reports.
      # For Actions that is the job's own `name:` — verified live on this repo via
      # the check-runs API, which returned bare job names ("Dev — Validate",
      # "Staging — Apply"), NOT a "workflow / job" string.
      # Both contexts below come from compliance-scan.yml, which triggers on every
      # PR to main with no path filter. plan.yml is deliberately NOT required: it
      # has path filters, so a docs-only PR would never report it and the merge
      # would block forever. "codeql-analysis" was removed because no CodeQL
      # workflow exists here; re-add it with the workflow, never before.
      contexts:
      - Validate Repo Allow-List
      - Policy Compliance Check
    required_pull_request_reviews:
      required_approving_review_count: 2
      dismiss_stale_reviews: true
      require_code_owner_reviews: true
      require_last_push_approval: true
    enforce_admins: true
    restrict_pushes: true
    require_signed_commits: true
    require_linear_history: true
    block_force_pushes: true
    block_deletions: true
teams:
  platform-admins: admin
  developers: pull
  auditors: pull
compliance:
  frameworks:
  - soc2
  - gdpr
  - iso27001
  data_classification: confidential
  required_gates:
    dependency_scan: true
    secret_scan: true
    license_check: true
    code_quality: true
    security_review: true
