name: "Terraform Plan"

on:
  pull_request:
    branches: [main]
    paths:
      - "repos/**"
      - "policy/**"
      - "*.tf"
      - "*.tfvars"
      - ".github/workflows/plan.yml"

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_LOG: "INFO"
  TF_INPUT: "0"

jobs:
  validate:
    name: "Validate & Plan"
    runs-on: ubuntu-latest
    environment: ${{ github.event.pull_request.base.ref == 'main' && 'staging' || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Validate YAML definitions
        run: |
          python3 scripts/validate_repos.py
          echo "All repo YAML definitions are valid."
      - name: Check secret inventory expiry
        run: |
          chmod +x scripts/check_secret_inventory.sh
          ./scripts/check_secret_inventory.sh docs/SECRETS_INVENTORY.md

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -out=tfplan \
            -detailed-exitcode \
            2>&1 | tee plan-output.txt
          
          # Exit codes: 0=no changes, 2=changes detected, 1=error
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan Gate Self-Test (prove the gate is not inert)
        run: python3 tests/test_plan_gate.py

      - name: Destroy / Replace Gate (STOP on destructive plan)
        # This gate cannot be EVALUATED in CI, and running it unconditionally made the check
        # permanently red: `terraform.tfstate` is gitignored (§4 read-only inventory), so
        # `terraform init` starts from an EMPTY state and every plan here is
        # "119 to add, 0 to destroy, 0 to replace". A create-only plan carries no
        # destroy/replace signal, so the step detected nothing while failing every PR that
        # touches *.tf, repos/**, policy/** or *.tfvars — noise that trains an operator to
        # merge through a red control (same class as S1-010; see S1-012).
        # This is NOT a weakening: the gate still runs unconditionally where the inventory
        # actually is — `make plan-gate` on the control-plane host, which `make apply` depends
        # on — and its logic is proven on every PR by the self-test above, whose fixtures
        # include the empty-state shape. The condition below is armed on POSITIVE evidence of
        # a readable inventory (a local state file, or a declared backend once S2-003 lands),
        # so the gate re-arms itself automatically after a remote-state migration. Verified:
        # host-with-state -> arms; CI-checkout -> skips; backend-declared -> arms.
        # `--allow-empty-state` is deliberately NOT used: it is the audited bootstrap-only
        # exception, and reaching for it here would be exactly the workaround AGENTS.md §5.2
        # forbids.
        run: |
          if [ -s terraform.tfstate ] || grep -qE '^[[:space:]]*backend[[:space:]]+"' *.tf 2>/dev/null; then
            terraform show -json tfplan > tfplan.json
            python3 scripts/plan_gate.py tfplan.json
          else
            echo "::notice title=Plan gate UNEVALUATED in CI::No inventory reachable from this checkout (terraform.tfstate is gitignored and no backend is declared), so the plan is create-only and carries no destroy/replace signal. Absence of a finding here is not a pass. The STOP gate runs on the control-plane host via 'make plan-gate', which 'make apply' depends on; its logic is proven by the Plan Gate Self-Test above."
            echo "Plan gate: **UNEVALUATED in CI** (no reachable inventory) — not a pass. See docs/drift-findings.md S1-012." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Policy Check (Conftest)
        run: |
          if command -v conftest &>/dev/null; then
            conftest test repos/ --policy policy/opa/ || true
          else
            echo "conftest not installed — skipping OPA policy check"
          fi

      - name: Comment Plan on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('plan-output.txt', 'utf8');
            const exitCode = '${{ steps.plan.outputs.exit_code }}';
            
            const status = exitCode === '0' ? 'No changes' :
                           exitCode === '2' ? 'Changes detected' : 'Error';
            const emoji = exitCode === '0' ? '✅' :
                          exitCode === '2' ? '📋' : '❌';
            
            const body = `## ${emoji} Terraform Plan — ${status}
            
            <details><summary>Show Plan Output</summary>
            
            \`\`\`
            ${output.substring(0, 60000)}
            \`\`\`
            
            </details>
            
            *Environment: \`${{ github.event.pull_request.base.ref == 'main' && 'staging' || 'dev' }}\`*
            *Triggered by: @${{ github.event.pull_request.user.login }}*`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });

      - name: Fail on error
        if: steps.plan.outputs.exit_code == '1'
        run: exit 1
