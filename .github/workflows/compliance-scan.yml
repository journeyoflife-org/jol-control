name: "Compliance Scan"

on:
  pull_request:
    branches: [main]
  schedule:
    # Weekly compliance scan — Saturday 02:00 UTC
    - cron: "0 2 * * 6"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  validate-repos:
    name: "Validate Repo Allow-List"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate all repo YAML definitions
        run: python3 scripts/validate_repos.py

      - name: Drift Gate Self-Test (prove the checker is not inert)
        # 11 fixtures replaying captured `gh repo list` output — including the exact
        # private-blind listing this workflow's own token produces. Runs offline against
        # a stub, so it needs no credentials and cannot be skipped into silence.
        run: python3 tests/test_drift_gate.py

      - name: Enforcement-Table Gate (AGENTS.md section 2)
        # AGENTS.md section 2 is what an agent reads before trusting any claim about this
        # organization, and it was checked by nobody. apply.yml now covers pushes to main
        # (AGENTS.md was added to its paths filter); this workflow covers pull requests and
        # the weekly schedule, so the rules file is validated on every path into main.
        run: python3 scripts/validate_agents_table.py AGENTS.md

      - name: Enforcement-Table Gate Self-Test (prove that gate is not inert)
        # 9 cases replaying a real captured copy of the table against mutations that
        # reproduce the mistakes an editor actually makes: an unescaped pipe that adds a
        # cell, a blank evidence column, a header-only table, a missing section.
        run: python3 tests/test_agents_gate.py

  policy-compliance:
    name: "Policy Compliance Check"
    needs: validate-repos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run compliance check
        run: |
          python3 scripts/compliance_check.py --output compliance-report.json
          echo "## Compliance Report" >> "$GITHUB_STEP_SUMMARY"
          cat compliance-report.json | python3 -m json.tool >> "$GITHUB_STEP_SUMMARY"

  drift-detection:
    name: "Drift Detection"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run drift detection
        # Exit codes: 0 evaluated-and-clean, 1 genuine drift, 2 cannot-check. 2 is reported
        # as its own reason because the runner-ephemeral GITHUB_TOKEN can only enumerate
        # public repositories (finding S14: that blindness once failed the weekly scan while
        # `make drift` on the host reported NO DRIFT). Red either way — an unverified
        # compliance control must never be presented as a passing one.
        # ORG_READ_TOKEN is the read-only org PAT documented in docs/runbooks.md RB-07; it has
        # been set as a jol-control repository secret since 2026-10-19, which is what makes this
        # job evaluate private repositories at all (verified: run 39255407378 reported
        # "evaluated": true with github_count 40, against 39 for the runner token). The fallback
        # is deliberate: if the secret is removed or expires, the expression reverts to
        # GITHUB_TOKEN and the job reports UNEVALUATED rather than a false DRIFT or a false PASS.
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 scripts/drift_detect.py | tee drift-report.json
          rc=${PIPESTATUS[0]}
          set -e
          case "$rc" in
            0) echo "Drift detection: EVALUATED, no drift." >> "$GITHUB_STEP_SUMMARY" ;;
            1) echo "::error title=Drift detected::The allow-list and the organization genuinely disagree; see the job log for the named repositories."
               echo "Drift detection: DRIFT DETECTED (exit 1)." >> "$GITHUB_STEP_SUMMARY"
               exit 1 ;;
            2) echo "::error title=Drift detection UNEVALUATED::ORG_READ_TOKEN is missing, expired, or lacks private-repository read, so absence cannot be concluded from this enumeration. Mint or rotate it per docs/runbooks.md RB-07, or run 'make drift' on the control-plane host. An unevaluated control is not a passing control."
               echo "Drift detection: UNEVALUATED (exit 2) — token cannot see private repos." >> "$GITHUB_STEP_SUMMARY"
               exit 1 ;;
            *) echo "::error title=Drift detection crashed::Unexpected exit code $rc — treated as unevaluated."
               exit 1 ;;
          esac

  security-scan:
    name: "Repository Security Scan"
    runs-on: ubuntu-latest
    # This job used to carry `strategy.matrix.tier: [governance, platform, devops, site]`,
    # and no step ever referenced `matrix.tier`. `actions/checkout` with no `repository:`
    # checks out jol-control only, so the matrix ran the SAME grep four times against the
    # SAME tree: four times the minutes, zero extra coverage, and a job name implying a
    # fleet-wide scan it never performed. Removed rather than left decorative (S1-010).
    # Fleet-wide secret scanning is recorded as a recommendation, not implemented here.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for secrets patterns
        # A scan that cannot fail is not a control. This step ended with
        # `echo "::warning::..."`, so a matched credential produced a yellow annotation and
        # a GREEN job: the secret was reported and nothing was blocked. It now exits 1.
        # Verified before arming it: at 26132e8 all four patterns match ZERO tracked files.
        # The only hit anywhere in the tree was one redacted password assignment inside
        # .venv/pip — third-party code, gitignored, and absent from a CI checkout; the
        # --exclude-dir list below makes a local reproduction agree with CI instead of
        # diverging on that one file.
        # EDITORS: this file is scanned by its own patterns. Writing an example credential
        # shape into a comment here fails the build — verified, not theoretical: a comment
        # quoting a password assignment was matched by pattern 4 during testing.
        # Two failure modes are kept distinct, as in the drift job above: a MATCH fails the
        # build, and a grep that could not RUN also fails it, because an unexecuted scan
        # must never be reported as a clean one.
        # Only file:line is printed. This repository is PUBLIC, so its Actions logs are
        # publicly readable — echoing grep's match would publish the very secret being found.
        run: |
          echo "Scanning for common secret patterns..."
          PATTERNS=(
            'AKIA[0-9A-Z]{16}'
            'ghp_[a-zA-Z0-9]{36}'
            'sk-[a-zA-Z0-9]{20,}'
            'password\s*=\s*["\x27][^\s]+["\x27]'
          )
          EXCLUDES=(--exclude-dir=.git --exclude-dir=.venv --exclude-dir=.terraform
                    --exclude-dir=node_modules --exclude-dir=__pycache__
                    --exclude=.secrets.baseline)
          FOUND=0
          BROKEN=0
          WORK=$(mktemp -d)
          set +e
          for pattern in "${PATTERNS[@]}"; do
            # grep's status is captured directly. Piping inside $( ) would make $? the exit
            # code of the LAST stage, not of grep, and a scan that found nothing would read
            # as a scan that found something.
            grep -rnE "$pattern" "${EXCLUDES[@]}" \
                 --include="*.py" --include="*.js" --include="*.ts" --include="*.tf" \
                 --include="*.yml" --include="*.yaml" . >"$WORK/hits" 2>"$WORK/err"
            rc=$?
            case "$rc" in
              0) cut -d: -f1,2 <"$WORK/hits"      # file:line only, never the matched text
                 echo "Potential secret pattern found: $pattern"
                 FOUND=1 ;;
              1) : ;;                             # no match — the clean case
              *) echo "grep exited $rc on pattern '$pattern' — the scan did not complete"
                 cat "$WORK/err"
                 BROKEN=1 ;;
            esac
          done
          set -e
          rm -rf "$WORK"
          if [ "$BROKEN" -eq 1 ]; then
            echo "::error title=Secret scan could not run::grep failed on at least one pattern, so absence of findings cannot be concluded. An unexecuted scan is not a passing scan."
            echo "Secret scan: UNEVALUATED — grep could not complete." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$FOUND" -eq 1 ]; then
            echo "::error title=Secret pattern detected::A credential-shaped string matched in a tracked file. Rotate it, purge it from history, and follow policy/compliance-gates.yml secret_scan.remediation."
            echo "Secret scan: FAILED — potential secrets in tracked files." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Secret scan: PASSED — no credential-shaped strings in tracked files." >> "$GITHUB_STEP_SUMMARY"
