name: "Compliance Scan"

on:
  pull_request:
    branches: [main]
  schedule:
    # Weekly compliance scan — Saturday 02:00 UTC
    - cron: "0 2 * * 6"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  validate-repos:
    name: "Validate Repo Allow-List"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate all repo YAML definitions
        run: python3 scripts/validate_repos.py

      - name: Drift Gate Self-Test (prove the checker is not inert)
        # 11 fixtures replaying captured `gh repo list` output — including the exact
        # private-blind listing this workflow's own token produces. Runs offline against
        # a stub, so it needs no credentials and cannot be skipped into silence.
        run: python3 tests/test_drift_gate.py

      - name: Enforcement-Table Gate (AGENTS.md section 2)
        # AGENTS.md section 2 is what an agent reads before trusting any claim about this
        # organization, and it was checked by nobody. apply.yml now covers pushes to main
        # (AGENTS.md was added to its paths filter); this workflow covers pull requests and
        # the weekly schedule, so the rules file is validated on every path into main.
        run: python3 scripts/validate_agents_table.py AGENTS.md

      - name: Enforcement-Table Gate Self-Test (prove that gate is not inert)
        # 9 cases replaying a real captured copy of the table against mutations that
        # reproduce the mistakes an editor actually makes: an unescaped pipe that adds a
        # cell, a blank evidence column, a header-only table, a missing section.
        run: python3 tests/test_agents_gate.py

  policy-compliance:
    name: "Policy Compliance Check"
    needs: validate-repos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run compliance check
        run: |
          python3 scripts/compliance_check.py --output compliance-report.json
          echo "## Compliance Report" >> "$GITHUB_STEP_SUMMARY"
          cat compliance-report.json | python3 -m json.tool >> "$GITHUB_STEP_SUMMARY"

  drift-detection:
    name: "Drift Detection"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run drift detection
        # Exit codes: 0 evaluated-and-clean, 1 genuine drift, 2 cannot-check. 2 is reported
        # as its own reason because the runner-ephemeral GITHUB_TOKEN can only enumerate
        # public repositories (finding S14: that blindness once failed the weekly scan while
        # `make drift` on the host reported NO DRIFT). Red either way — an unverified
        # compliance control must never be presented as a passing one.
        # ORG_READ_TOKEN is the read-only org PAT documented in docs/runbooks.md RB-07; it has
        # been set as a jol-control repository secret since 2026-10-19, which is what makes this
        # job evaluate private repositories at all (verified: run 39255407378 reported
        # "evaluated": true with github_count 40, against 39 for the runner token). The fallback
        # is deliberate: if the secret is removed or expires, the expression reverts to
        # GITHUB_TOKEN and the job reports UNEVALUATED rather than a false DRIFT or a false PASS.
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 scripts/drift_detect.py | tee drift-report.json
          rc=${PIPESTATUS[0]}
          set -e
          case "$rc" in
            0) echo "Drift detection: EVALUATED, no drift." >> "$GITHUB_STEP_SUMMARY" ;;
            1) echo "::error title=Drift detected::The allow-list and the organization genuinely disagree; see the job log for the named repositories."
               echo "Drift detection: DRIFT DETECTED (exit 1)." >> "$GITHUB_STEP_SUMMARY"
               exit 1 ;;
            2) echo "::error title=Drift detection UNEVALUATED::ORG_READ_TOKEN is missing, expired, or lacks private-repository read, so absence cannot be concluded from this enumeration. Mint or rotate it per docs/runbooks.md RB-07, or run 'make drift' on the control-plane host. An unevaluated control is not a passing control."
               echo "Drift detection: UNEVALUATED (exit 2) — token cannot see private repos." >> "$GITHUB_STEP_SUMMARY"
               exit 1 ;;
            *) echo "::error title=Drift detection crashed::Unexpected exit code $rc — treated as unevaluated."
               exit 1 ;;
          esac

  security-scan:
    name: "Repository Security Scan"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tier: [governance, platform, devops, site]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for secrets patterns
        run: |
          echo "Scanning for common secret patterns..."
          PATTERNS=(
            'AKIA[0-9A-Z]{16}'
            'ghp_[a-zA-Z0-9]{36}'
            'sk-[a-zA-Z0-9]{20,}'
            'password\s*=\s*["\x27][^\s]+["\x27]'
          )
          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if grep -rnE "$pattern" --include="*.py" --include="*.js" --include="*.ts" --include="*.tf" --include="*.yml" --include="*.yaml" . 2>/dev/null | grep -v ".secrets.baseline" | grep -v "node_modules"; then
              echo "WARNING: Potential secret pattern found: $pattern"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "::warning::Potential secrets detected in code — review immediately"
          fi
