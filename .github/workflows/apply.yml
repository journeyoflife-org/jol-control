name: "Terraform Apply"

# ──────────────────────────────────────────────────────────────────────────────
# STATUS: validation only. The apply jobs are DISABLED until remote state exists.
#
# Terraform state is local to the control-plane host (gitignored, no backend), so
# a CI runner plans from an EMPTY state. Verified from this workflow's own run
# history: the plan reported "120 to add, 0 to change, 0 to destroy" and the apply
# then failed with "403 Resource not accessible by integration" on
# POST /orgs/journeyoflife-org/repos, because the default GITHUB_TOKEN has no org
# scope. prevent_destroy would NOT have stopped that plan — from an empty state
# nothing is destroyed, everything is a create.
#
# To enable the apply jobs: provision remote state (HCP Terraform), supply an
# org-scoped token, create the 'production' environment WITH required reviewers,
# then set the repository variable TF_REMOTE_STATE_ENABLED=true. Each apply job
# runs scripts/plan_gate.py before applying.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - "repos/**"
      - "policy/**"
      - "*.tf"
      - "*.tfvars"
      # AGENTS.md is a control surface, not prose: section 2 carries the enforcement truth an
      # agent is required to read first, so an edit to it must be validated like a schema.
      - "AGENTS.md"
      # The gates themselves: a change to scripts/ or tests/ must prove the gate still
      # works, otherwise a broken gate could land green simply by not being exercised.
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/apply.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: "terraform-apply"
  cancel-in-progress: false

env:
  TF_LOG: "INFO"
  TF_INPUT: "0"

jobs:
  # ── Stage 1: Validation only — applies are gated off ──────────────────────
  dev-validate:
    name: "Dev — Validate"
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Validate YAML
        run: python3 scripts/validate_repos.py

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Plan Gate Self-Test (prove the gate is not inert)
        run: python3 tests/test_plan_gate.py

      - name: State Gate Self-Test (prove the gate is not inert)
        # 23 assertions over the three exit codes: 0 safe / 1 refused / 2 cannot-check.
        # Some assert on the gate's OUTPUT rather than its exit code — the stale-copy NOTICE
        # never changes the verdict, so an exit-code-only suite passed straight over S2-007.
        # The gate itself is a HOST-SIDE pre-apply check and is not run here: CI has no
        # backend credentials, so it cannot read the inventory it would be judging.
        run: bash tests/test_state_gate.sh

      - name: Enforcement-Table Gate (AGENTS.md section 2)
        # Section 2 is what an agent reads before trusting any claim about this
        # organization. It was checked by nobody, and a documentation-only commit used to start
        # no run at all; AGENTS.md is now in this workflow's paths filter so a change to the
        # rules file is validated rather than trusted.
        run: python3 scripts/validate_agents_table.py AGENTS.md

      - name: Enforcement-Table Gate Self-Test (prove that gate is not inert)
        # 9 cases on a verbatim capture of the live table, with the broken variants derived
        # from it by mutation: unescaped pipe, blank evidence cell, header-only table,
        # missing section. Offline, so it cannot be skipped into silence.
        run: python3 tests/test_agents_gate.py

      - name: Backup Gate Self-Test (prove the RB-08 script is not inert)
        # 23 cases over scripts/backup_state.sh: 0 both custody paths proven / 1 refused /
        # 2 written-but-unverified. Fifteen need only jq and run here; the eight crypto cases need
        # age AND a real terraform.tfstate, which this runner cannot have (state is gitignored), so
        # they report SKIPPED and the suite still exits 0 — a skipped case is announced, never counted
        # as a pass. Case 19 also requires docs/runbooks.md's fence to be byte-identical to the
        # script, so the runbook cannot drift from the code it documents.
        # What the suite pins: an earlier revision wrote plaintext state at the ambient umask and left
        # it on disk on every failure path, a refused same-second re-run deleted the original backup,
        # and the sidecar claimed "off-host-verified" for a key that was never checked for location.
        # COVERAGE CAVEAT, stated because it was once written wrong: this workflow triggers on
        # push:branches:[main] only, so a pull request shows NO signal from this step. First real
        # execution is the merge commit. Keep the case count here in step with the suite — it has
        # already been left stale twice.
        run: bash tests/test_backup_gate.sh

      - name: Record why no plan or apply runs in CI
        run: |
          {
            echo "## Terraform Apply — validation only"
            echo ""
            echo "No plan and no apply runs here. State is local to the"
            echo "control-plane host, so this runner would plan from an empty"
            echo "state and propose to re-create all 40 repositories."
            echo ""
            echo "Apply jobs are gated behind TF_REMOTE_STATE_ENABLED (unset)."
            echo "Authoritative path: make plan -> make plan-gate -> make apply"
            echo "on the control-plane host."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Stage 2: Staging apply — DISABLED until remote state exists ───────────
  staging-apply:
    name: "Staging — Apply"
    needs: dev-validate
    if: vars.TF_REMOTE_STATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan (staging)
        run: |
          terraform plan -input=false -no-color -out=tfplan \
            -var="environment=staging"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Destroy / Replace Gate (STOP on destructive plan)
        run: |
          terraform show -json tfplan > tfplan.json
          python3 scripts/plan_gate.py tfplan.json

      - name: Terraform Apply (staging)
        run: terraform apply -input=false -auto-approve tfplan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Stage 3: Production apply — DISABLED; no approval gate exists ─────────
  # The 'production' environment does NOT exist (verified: only 'dev' and
  # 'staging' are defined) and neither has protection_rules, so there is no
  # manual approval gate today. Create the environment WITH required reviewers
  # before enabling this job.
  prod-apply:
    name: "Production — Apply"
    needs: staging-apply
    if: vars.TF_REMOTE_STATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/orgs/journeyoflife-org/repositories

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan (production)
        run: |
          terraform plan -input=false -no-color -out=tfplan \
            -var="environment=prod"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Destroy / Replace Gate (STOP on destructive plan)
        run: |
          terraform show -json tfplan > tfplan.json
          python3 scripts/plan_gate.py tfplan.json

      - name: Terraform Apply (production)
        run: terraform apply -input=false -auto-approve tfplan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post-apply compliance snapshot
        run: |
          python3 scripts/compliance_check.py --output compliance-snapshot.json
          echo "Compliance snapshot generated."

      - name: Drift detection
        # Same credential policy as compliance-scan.yml's drift job (docs/runbooks.md RB-07): the
        # ambient runner token enumerates public repositories only, so with it this step returns
        # UNEVALUATED (exit 2) on a fleet that contains a private repository and fails the job for
        # a reason that is not drift. Harmless while this job is gated off by
        # vars.TF_REMOTE_STATE_ENABLED, and a landmine the moment someone enables it.
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/drift_detect.py
          echo "Drift detection complete."
