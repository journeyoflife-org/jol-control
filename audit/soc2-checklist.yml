# ──────────────────────────────────────────────────────────────────────────────
# SOC 2 Type II — Trust Service Criteria Checklist
# ──────────────────────────────────────────────────────────────────────────────
# Mapped to jol-control enforcement points.
# Review cadence: Quarterly
# Last reviewed: 2026-09-30
# ──────────────────────────────────────────────────────────────────────────────

framework: "SOC 2 Type II"
version: "2017 Trust Services Criteria"
owner: "platform-admins"

trust_service_criteria:
  CC6.1:
    title: "Logical and Physical Access Controls"
    controls:
      - id: "CC6.1-01"
        description: "GitHub organization access is restricted to authorized personnel"
        evidence: "NONE — teams referenced in repos/*.yml (platform-admins, developers, auditors) do not exist. Existing teams: backend, data, devops, frontend, security. No team-repository bindings enforced."
        enforcement: "terraform: github_team_repository — NOT ENFORCED (teams do not exist)"
        status: "not_implemented"
      - id: "CC6.1-02"
        description: "Branch protection prevents unauthorized direct pushes to main"
        evidence: "github_branch_protection resources with enforce_admins=true"
        enforcement: "terraform: github_branch_protection"
        status: "implemented"
      - id: "CC6.1-03"
        description: "Signed commits required for all changes"
        evidence: "require_signed_commits = true on all branch protection rules"
        enforcement: "terraform: github_branch_protection"
        status: "implemented"

  CC6.2:
    title: "System Boundaries & Credential Management"
    controls:
      - id: "CC6.2-01"
        description: "Secret scanning prevents credentials from entering git"
        evidence: "GitHub Secret Scanning + Push Protection enabled on all repos"
        enforcement: "terraform: security_and_analysis block"
        status: "implemented"
      - id: "CC6.2-02"
        description: "No secrets stored in Terraform state or variable files"
        evidence: "terraform.tfvars contains no secrets; CI uses env vars"
        enforcement: "policy: data_handling.secrets_in_git = prohibited"
        status: "implemented"

  CC6.3:
    title: "Data Protection"
    controls:
      - id: "CC6.3-01"
        description: "Data classification required for every repository"
        evidence: "repos/*.yml compliance.data_classification field"
        enforcement: "scripts/validate_repos.py"
        status: "implemented"
      - id: "CC6.3-02"
        description: "Terraform state stored locally (terraform.tfstate)"
        evidence: "main.tf (no backend block); state is local plaintext"
        enforcement: "terraform: main.tf backend config"
        status: "not_encrypted"

  CC7.1:
    title: "System Operations — Monitoring"
    controls:
      - id: "CC7.1-01"
        description: "Dependency vulnerability scanning on every PR"
        evidence: "NONE — compliance-scan.yml does not run dependency-review action. Dependabot alerts enabled on all repos, but no PR gate."
        enforcement: "CI: dependency_scan gate — NOT IMPLEMENTED"
        status: "not_implemented"
      - id: "CC7.1-02"
        description: "SAST (CodeQL) on every PR and push to main"
        evidence: "NONE — CodeQL not running. Verified via code-scanning/analyses API: 'no analysis found' on jol-control. compliance-scan.yml does not run CodeQL."
        enforcement: "CI: sast gate — NOT IMPLEMENTED"
        status: "not_implemented"
      - id: "CC7.1-03"
        description: "IaC security scanning (Checkov/Trivy) on every PR"
        evidence: "NONE — compliance-scan.yml runs grep for secret patterns only. No Checkov, Trivy, tflint, or conftest in CI."
        enforcement: "CI: iac_scan gate — NOT IMPLEMENTED"
        status: "not_implemented"

  CC7.2:
    title: "System Operations — Incident Response"
    controls:
      - id: "CC7.2-01"
        description: "Incident response runbooks documented"
        evidence: "jol-incident-response repository"
        enforcement: "Manual review"
        status: "implemented"
      - id: "CC7.2-02"
        description: "Secret exposure triggers immediate rotation"
        evidence: "secret_scan gate remediation steps"
        enforcement: "policy: compliance-gates.yml secret_scan.remediation"
        status: "implemented"

  CC8.1:
    title: "Change Management"
    controls:
      - id: "CC8.1-01"
        description: "All changes require pull request with approvals"
        evidence: "NONE — solo_mode=true drops required_pull_request_reviews entirely from branch protection. Branch protection keeps only: enforce_admins, signed commits, linear history, no force push."
        enforcement: "terraform: github_branch_protection — review requirement OMITTED in solo_mode"
        status: "not_implemented"
      - id: "CC8.1-02"
        description: "Changes to governance repos require 2 approvals + CODEOWNERS"
        evidence: "NONE — solo_mode=true drops required_pull_request_reviews for both governance and standard tiers. 2-approver rule unsatisfiable (org has 2 members total)."
        enforcement: "terraform: github_branch_protection.governance — review requirement OMITTED in solo_mode"
        status: "not_implemented"
      - id: "CC8.1-03"
        description: "Terraform plan posted as PR comment for review"
        evidence: ".github/workflows/plan.yml"
        enforcement: "CI: plan workflow"
        status: "implemented"
      - id: "CC8.1-04"
        description: "Production apply requires manual environment approval"
        evidence: "NONE — verified via the GitHub environments API: no 'production' environment exists (only 'dev' and 'staging'), and neither has protection_rules"
        enforcement: "CI: apply.yml prod-apply job — gated off behind vars.TF_REMOTE_STATE_ENABLED; CI cannot apply because state is local to the control-plane host"
        status: "not_implemented"

  A1.1:
    title: "Capacity Planning"
    controls:
      - id: "A1.1-01"
        description: "Service inventory with criticality tiers"
        evidence: "jol-dr/registers/service-inventory.yml"
        enforcement: "jol-dr: register review"
        status: "implemented"

  A1.2:
    title: "Backup Processes and Recovery Infrastructure"
    controls:
      - id: "A1.2-01"
        description: "Backup policy documented"
        evidence: "jol-dr/policy/backup-policy.md"
        enforcement: "jol-dr: policy review"
        status: "implemented"
      - id: "A1.2-02"
        description: "Backup schedule enforced"
        evidence: "jol-dr/registers/backup-schedule.yml, jol-dr/scripts/verify-backups.sh"
        enforcement: "jol-dr: backup_freshness gate"
        status: "not_verified"
      - id: "A1.2-03"
        description: "Recovery infrastructure tested"
        evidence: "jol-dr/rehearsals/records/"
        enforcement: "jol-dr: rehearsal_schedule gate"
        status: "not_tested"

  A1.3:
    title: "Recovery Plan Testing"
    controls:
      - id: "A1.3-01"
        description: "Rehearsal schedule defined"
        evidence: "jol-dr/rehearsals/schedule.yml"
        enforcement: "jol-dr: rehearsal_schedule gate"
        status: "implemented"
      - id: "A1.3-02"
        description: "Rehearsals performed per schedule"
        evidence: "jol-dr/rehearsals/records/"
        enforcement: "jol-dr: rehearsal_schedule gate"
        status: "not_tested"

  A1.4:
    title: "Effects of System Changes During Recovery"
    controls:
      - id: "A1.4-01"
        description: "DR plan includes verification phase"
        evidence: "jol-dr/plans/disaster-recovery-plan.md Phase 4"
        enforcement: "jol-dr: plan review"
        status: "implemented"

  A1.5:
    title: "System Inventory for Disaster Recovery"
    controls:
      - id: "A1.5-01"
        description: "Service inventory with recovery order"
        evidence: "jol-dr/registers/service-inventory.yml, jol-dr/registers/recovery-order.yml"
        enforcement: "jol-dr: register review"
        status: "implemented"
